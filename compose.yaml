x-php-attributes: &php-attributes
  image: ${IMAGES_PREFIX:-mztrix/php-fpm}
  build:
    context: .
    target: base
  restart: unless-stopped
  healthcheck:
    test: [ "CMD", "healthcheck" ]
    interval: 1s
    timeout: 1s
    retries: 3
  entrypoint: ["php-entrypoint"]
  command: ["php-fpm", "-F"]

services:
  php:
    <<: *php-attributes