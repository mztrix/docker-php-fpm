[opcache]
opcache.enable=1                     ; Enable OPcache for performance optimization
opcache.enable_cli=0                 ; Disable OPcache for CLI
opcache.memory_consumption=64        ; Reduce memory allocation for OPcache (64MB)
opcache.interned_strings_buffer=8    ; Memory buffer for interned strings (8MB)
opcache.max_accelerated_files=4000   ; Allow up to 4000 files in cache
opcache.validate_timestamps=1        ; Enable timestamp validation to detect file changes
opcache.revalidate_freq=1            ; Check for file changes every second
opcache.fast_shutdown=1              ; Enable fast memory deallocation on script termination