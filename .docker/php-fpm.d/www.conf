; ===============================
; PHP-FPM - GLOBAL CONFIGURATION
; ===============================

[global]
error_log = /dev/stderr
log_level = notice

; ===============================
; CONFIGURATION OF THE "WWW" POOL
; ===============================

[www]

; Do not define user/group here when PHP-FPM already runs as non-root.
; user = www-data
; group = www-data

; ===============================
; SOCKET LISTENING CONFIGURATION
; ===============================

listen = /var/run/php/www.sock

; Do not force owner/group when PHP-FPM runs as non-root.
; The socket will be created by the current runtime user.
; listen.owner = www-data
; listen.group = www-data

listen.mode = 0660

; ===============================
; PROCESS MANAGER CONFIGURATION
; ===============================

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; ===============================
; ACCESS LOG CONFIGURATION
; ===============================

access.log = /dev/stdout
catch_workers_output = yes
decorate_workers_output = no
access.format = "%R - %m %r - %s - %C"

; ===============================
; ENVIRONMENT VARIABLES CONFIGURATION
; ===============================

clear_env = no

; ===============================
; MONITORING ENDPOINTS CONFIGURATION
; ===============================

ping.path = /ping
ping.response = pong

; ===============================
; SECURITY SETTINGS CONFIGURATION
; ===============================

security.limit_extensions = .php